    function pickPropArray(students, attribute){
        values = []
        students.forEach(student => {
            value = student[attribute]
            if (value !== undefined){
                values.push(value)
            }
        });

    function spinWords(text){
        splitedWords = text.split(' ')
        words = []
        splitedWords.forEach(element => {
            if  (element.length >= 5){
                    element = element.split('').reverse().join('')
            }
            words.push(element)
        });
        return words
    }

    function findSum(numberArray, target){
        indexes = []
        iterator = 0
        numberArray.forEach(element => {
            iterator++
            for (let index = iterator; index < numberArray.length; index++) {
                secondValue = numberArray[index];
                if ((element + secondValue) === target) {
                    indexes.push(iterator-1)
                    indexes.push(index)
                }
            }
        });
        return indexes
    }
    
    
    function findLongestCommonPrefix(strs) {
        iterator = 0
        commString = ""
        b = false;
        if (strs.length === 0) return "";
        shortestElement = strs.reduce(function(a, b){
       
            return a.length < b.length ? a : b
        })
    
        strs.splice(strs.indexOf(shortestElement), 1)
    
        shortestElement.split('').forEach(char => {
            iterator++
            b = true
            for (let index = iterator; index < shortestElement.length; index++) {
               char+=shortestElement[index]
               strs.forEach(element => {
                if(!element.includes(char)){
                    b = false
                }
            })
                if(!b)
                {
                    break
                }else
                {
                    if(char.length > commString.length){
                        commString = char
                    }
                }
            }
        })
        return commString;
    }
